# 融合层 Regime 权重配置
# ──────────────────────────────────────────────────────────────────
# 每个 regime 是一组权重 (chan / momentum / vpf)，和应为 1.0。
# 修改此文件即可调参：无需改代码、无需重新打包（覆盖同名文件即可热更新权重）。
# 字段缺失 / 格式错误 / pyyaml 未装时，自动回退到 fusion_regime.py 内置
# _FALLBACK_REGIME_WEIGHTS（= 下方历史默认值），融合行为完全一致。
#
# 短线三席：缠论(chan) / 动能(momentum) / 价量资金(vpf)；日线威科夫已退出融合。

regime_weights:
  # 大盘好 → 动量占优（趋势延续靠动量）
  正常:
    chan: 0.3
    momentum: 0.45
    vpf: 0.25
  # 大盘弱 → 缠论占优（结构更可靠）
  偏弱:
    chan: 0.5
    momentum: 0.15
    vpf: 0.35
  # 大盘很差 → 全员空仓
  很差:
    chan: 0.0
    momentum: 0.0
    vpf: 0.0
  # 未知 → fallback 到"正常"（保守）
  未知:
    chan: 0.3
    momentum: 0.45
    vpf: 0.25
