[project]
name = "trader"
version = "2.4.0"
description = "A股交易决策辅助系统 — 缠论/威科夫/筹码/ATR/利弗莫尔分析"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "numpy>=1.24",
]

[project.optional-dependencies]
full = [
    "akshare>=1.10",
    "mootdx>=0.5",
    "pandas>=2.0",
]
async = [
    "aiohttp>=3.9",
]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trader_shared*"]

[tool.setuptools.package-dir]
"trader_shared" = "02-共享模块-shared/trader_shared"

[tool.pytest.ini_options]
testpaths = ["02-共享模块-shared/tests"]
pythonpath = [
    "02-共享模块-shared",
    "02-共享模块-shared/02-候选逻辑-candidate",
    "02-共享模块-shared/01-行情数据-market-data",
    "02-共享模块-shared/scripts",
    "02-共享模块-shared/03-输出校验-contracts",
    "02-共享模块-shared/trader_shared",
]
